<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치즈보드 — WF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --border: #2a2a2a;
    --text-primary: #e8e8e8;
    --text-secondary: #888;
    --text-muted: #555;
    --accent: #22c55e;
  }
  body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-primary); }

  /* 헤더 */
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
  }
  .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-shadow: 0 0 20px rgba(34,197,94,.35); white-space: nowrap; }
  .logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 4px; }
  .search-wrap { flex: 1; max-width: 600px; display: flex; }
  .search-input {
    flex: 1; padding: 9px 14px; border: 1.5px solid var(--border); border-right: none;
    border-radius: 6px 0 0 6px; font-size: 14px; outline: none;
    background: #0f0f0f; color: var(--text-primary);
  }
  .search-input:focus { border-color: var(--accent); }
  .search-btn {
    padding: 9px 16px; background: var(--accent); color: #000; border: none;
    border-radius: 0 6px 6px 0; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  /* GNB */
  .gnb {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; display: flex; position: sticky; top: 57px; z-index: 99;
  }
  .gnb-item {
    padding: 12px 24px; font-size: 14px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent;
  }
  .gnb-item.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* 컨텐츠 */
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  /* 카드 그리드 */
  .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .card-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px)  { .card-grid { grid-template-columns: 1fr; } }

  /* 카드 */
  .card {
    background: var(--surface); border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 24px rgba(34,197,94,.12); border-color: #333; }
  .card-thumb {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #333; font-size: 12px;
  }
  .card-duration {
    position: absolute; bottom: 7px; right: 7px;
    background: rgba(0,0,0,.8); color: #ddd;
    font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
  }
  .card-body { padding: 10px 12px 12px; }
  .card-streamer { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: #2a2a2a; flex-shrink: 0; }
  .streamer-name { font-size: 12px; color: var(--text-secondary); }
  .card-title {
    font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { font-size: 11px; color: var(--text-muted); }

  /* 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 12px; width: 100%; max-width: 820px;
    overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal-video {
    width: 100%; aspect-ratio: 16/9; background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: #444; font-size: 13px; position: relative;
  }
  .play-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(34,197,94,.15); border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--accent);
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
    border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none;
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-info { padding: 16px 20px 20px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
  .modal-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .dot { color: #333; }
  .modal-avatar { width: 24px; height: 24px; border-radius: 50%; background: #2a2a2a; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-primary {
    padding: 9px 18px; background: var(--accent); color: #000; border: none;
    border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-ghost {
    padding: 9px 18px; background: #1e1e1e; color: var(--text-secondary);
    border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🧀 치즈보드 <span>beta</span></div>
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="클립, VOD 제목으로 검색...">
    <button class="search-btn">검색</button>
  </div>
</header>

<nav class="gnb">
  <button class="gnb-item active">✂ 클립</button>
  <button class="gnb-item">▶ VOD</button>
</nav>

<div class="container">
  <div class="section-title">🔥 인기 클립</div>
  <div class="card-grid" id="grid"></div>
</div>

<!-- 재생 모달 -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)close()">
  <div class="modal">
    <div class="modal-video">
      <div class="play-icon">▶</div>
      <span>iframe 재생 영역</span>
      <button class="modal-close" onclick="close()">✕</button>
    </div>
    <div class="modal-info">
      <div class="modal-title">울챔스 레전드 장면 모음.zip</div>
      <div class="modal-meta">
        <div class="modal-avatar"></div>
        울프 <span class="dot">·</span> 21.1만 회 <span class="dot">·</span> 3일 전 <span class="dot">·</span> 8:24
      </div>
      <div class="modal-actions">
        <button class="btn-primary">↗ 치지직에서 보기</button>
        <button class="btn-ghost" onclick="close()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
  const data = [
    { title:'울챔스 레전드 장면 모음.zip', streamer:'울프', views:'21.1만', date:'3일 전', dur:'8:24' },
    { title:'침착맨 반응 레전드 박제', streamer:'침착맨', views:'15.3만', date:'5일 전', dur:'3:41' },
    { title:'이 장면은 진짜 너무 웃겼음 ㅋㅋ', streamer:'풍월량', views:'9.8만', date:'1일 전', dur:'1:12' },
    { title:'진짜 말도 안 되는 캐리 클립', streamer:'인섹', views:'7.2만', date:'2일 전', dur:'2:05' },
    { title:'합방 중 터진 레전드 순간', streamer:'강지', views:'12.4만', date:'4일 전', dur:'5:33' },
    { title:'BRO vs KT 명장면', streamer:'LCK', views:'44.2만', date:'10일 전', dur:'4:17' },
    { title:'이거 보고 웃겨서 ㅋㅋ 진짜', streamer:'탬탬버린', views:'5.1만', date:'6일 전', dur:'0:58' },
    { title:'역대급 한타 클립 모음', streamer:'울프', views:'18.9만', date:'2일 전', dur:'6:45' },
  ];

  document.getElementById('grid').innerHTML = data.map(d => `
    <div class="card" onclick="document.getElementById('modal').classList.add('open')">
      <div class="card-thumb">
        <span>썸네일</span>
        <span class="card-duration">${d.dur}</span>
      </div>
      <div class="card-body">
        <div class="card-streamer"><div class="avatar"></div><span class="streamer-name">${d.streamer}</span></div>
        <div class="card-title">${d.title}</div>
        <div class="card-meta">${d.views} 회 · ${d.date}</div>
      </div>
    </div>`).join('');

  function close() { document.getElementById('modal').classList.remove('open'); }
</script>
</body>
</html>
