<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치즈보드 — WF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-elevated: #151515;
    --surface-muted: #1a1a1a;
    --border: #2a2a2a;
    --border-strong: #3b3b3b;
    --field: #111611;
    --field-hover: #151a15;
    --field-border: #3a3a3a;
    --field-divider: #303a33;
    --search-bg: #090f0b;
    --search-scope-bg: #101510;
    --text-primary: #e8e8e8;
    --text-secondary: #888;
    --text-muted: #555;
    --placeholder: #6f6f6f;
    --accent: #22c55e;
    --accent-hover: #16a34a;
    --accent-foreground: #000;
    --accent-soft: rgba(34,197,94,.14);
    --focus-ring: rgba(34,197,94,.16);
    --focus-ring-soft: rgba(34,197,94,.14);
    --logo-glow: rgba(34,197,94,.35);
    --card-hover-shadow: rgba(34,197,94,.12);
    --topic-hover-shadow: rgba(34,197,94,.18);
    --play-bg: rgba(34,197,94,.15);
    --thumb-bg: #1a1a1a;
    --thumb-text: #333;
    --avatar-bg: #2a2a2a;
    --video-bg: #000;
    --overlay: rgba(0,0,0,.8);
    --shadow: rgba(0,0,0,.45);
    --soft-highlight: rgba(255,255,255,.035);
    --switcher-bg: #050505;
    --hero-bg: linear-gradient(135deg, #1a2e1a 0%, #0a0a0a 60%, #1a1a2e 100%);
    --hero-overlay: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 100%);
    --topic-overlay: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
    --hero-text: #fff;
    --hero-title-shadow: rgba(0,0,0,.6);
    --hero-cover-text: #2a2a2a;
    --duration-bg: rgba(0,0,0,.8);
    --duration-text: #ddd;
    --floating-control-bg: rgba(0,0,0,.55);
    --floating-control-hover: rgba(0,0,0,.8);
    --floating-control-border: rgba(255,255,255,.15);
    --floating-control-text: #fff;
    --vod-badge-bg: rgba(59,130,246,.85);
    --vod-badge-text: #fff;
    --clip-badge-bg: rgba(34,197,94,.9);
    --clip-badge-text: #000;
  }
  :root[data-theme="light"] .search-wrap {
    border-color: rgba(22,163,74,.30);
    box-shadow: 0 0 0 1px rgba(22,163,74,.08), 0 2px 8px rgba(0,0,0,.1);
  }
  :root[data-theme="light"] .search-scope select { color: #1a1a1a; }
  :root[data-theme="light"] .search-wrap:focus-within {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,.22), inset 0 1px 0 rgba(22,163,74,.08);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f4;
    --surface: #ffffff;
    --surface-elevated: #ffffff;
    --surface-muted: #eef1ec;
    --border: #d8ded3;
    --border-strong: #b8c2b3;
    --field: #ffffff;
    --field-hover: #f3f7ef;
    --field-border: #c7d1c2;
    --field-divider: #c8d4c4;
    --search-bg: #ffffff;
    --search-scope-bg: #eef6ed;
    --text-primary: #141714;
    --text-secondary: #5d665d;
    --text-muted: #8a9287;
    --placeholder: #8a9287;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --accent-foreground: #ffffff;
    --accent-soft: rgba(22,163,74,.12);
    --focus-ring: rgba(22,163,74,.18);
    --focus-ring-soft: rgba(22,163,74,.15);
    --logo-glow: rgba(22,163,74,.18);
    --card-hover-shadow: rgba(22,101,52,.14);
    --topic-hover-shadow: rgba(22,101,52,.18);
    --play-bg: rgba(22,163,74,.12);
    --thumb-bg: #edf1eb;
    --thumb-text: #9ca69a;
    --avatar-bg: #dfe6dc;
    --video-bg: #020617;
    --overlay: rgba(10,15,12,.62);
    --shadow: rgba(23,37,28,.16);
    --soft-highlight: rgba(22,163,74,.08);
    --switcher-bg: #edf2ea;
    --hero-bg: linear-gradient(135deg, #d9f99d 0%, #f8faf7 48%, #dbeafe 100%);
    --hero-overlay: linear-gradient(180deg, rgba(255,255,255,0) 24%, rgba(255,255,255,.86) 100%);
    --topic-overlay: linear-gradient(180deg, rgba(255,255,255,0) 36%, rgba(255,255,255,.72) 100%);
    --hero-text: #111827;
    --hero-title-shadow: rgba(255,255,255,.55);
    --hero-cover-text: #9aa69a;
    --duration-bg: rgba(17,24,39,.82);
    --duration-text: #ffffff;
    --floating-control-bg: rgba(255,255,255,.72);
    --floating-control-hover: rgba(255,255,255,.94);
    --floating-control-border: rgba(22,101,52,.22);
    --floating-control-text: #14532d;
    --vod-badge-bg: rgba(37,99,235,.9);
    --vod-badge-text: #ffffff;
    --clip-badge-bg: rgba(22,163,74,.92);
    --clip-badge-text: #ffffff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) .search-wrap {
      border-color: rgba(22,163,74,.30);
      box-shadow: 0 0 0 1px rgba(22,163,74,.08), 0 2px 8px rgba(0,0,0,.1);
    }
    :root:not([data-theme="dark"]) .search-scope select { color: #1a1a1a; }
    :root:not([data-theme="dark"]) .search-wrap:focus-within {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,.22), inset 0 1px 0 rgba(22,163,74,.08);
    }
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f6f7f4;
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --surface-muted: #eef1ec;
      --border: #d8ded3;
      --border-strong: #b8c2b3;
      --field: #ffffff;
      --field-hover: #f3f7ef;
      --field-border: #c7d1c2;
      --field-divider: #c8d4c4;
      --search-bg: #ffffff;
      --search-scope-bg: #eef6ed;
      --text-primary: #141714;
      --text-secondary: #5d665d;
      --text-muted: #8a9287;
      --placeholder: #8a9287;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --accent-foreground: #ffffff;
      --accent-soft: rgba(22,163,74,.12);
      --focus-ring: rgba(22,163,74,.18);
      --focus-ring-soft: rgba(22,163,74,.15);
      --logo-glow: rgba(22,163,74,.18);
      --card-hover-shadow: rgba(22,101,52,.14);
      --topic-hover-shadow: rgba(22,101,52,.18);
      --play-bg: rgba(22,163,74,.12);
      --thumb-bg: #edf1eb;
      --thumb-text: #9ca69a;
      --avatar-bg: #dfe6dc;
      --video-bg: #020617;
      --overlay: rgba(10,15,12,.62);
      --shadow: rgba(23,37,28,.16);
      --soft-highlight: rgba(22,163,74,.08);
      --switcher-bg: #edf2ea;
      --hero-bg: linear-gradient(135deg, #d9f99d 0%, #f8faf7 48%, #dbeafe 100%);
      --hero-overlay: linear-gradient(180deg, rgba(255,255,255,0) 24%, rgba(255,255,255,.86) 100%);
      --topic-overlay: linear-gradient(180deg, rgba(255,255,255,0) 36%, rgba(255,255,255,.72) 100%);
      --hero-text: #111827;
      --hero-title-shadow: rgba(255,255,255,.55);
      --hero-cover-text: #9aa69a;
      --duration-bg: rgba(17,24,39,.82);
      --duration-text: #ffffff;
      --floating-control-bg: rgba(255,255,255,.72);
      --floating-control-hover: rgba(255,255,255,.94);
      --floating-control-border: rgba(22,101,52,.22);
      --floating-control-text: #14532d;
      --vod-badge-bg: rgba(37,99,235,.9);
      --vod-badge-text: #ffffff;
      --clip-badge-bg: rgba(22,163,74,.92);
      --clip-badge-text: #ffffff;
    }
  }
  body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text-primary); }

  /* 헤더 */
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
  }
  .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-shadow: 0 0 20px var(--logo-glow); white-space: nowrap; }
  .logo span { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 4px; }
  .search-area {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .header-filters {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }

  /* 검색 바: 타입 탭 + 입력 + 버튼이 하나의 테두리 안에 묶임 */
  .search-wrap {
    flex: 1 1 680px; max-width: 800px; min-width: 300px; height: 42px;
    display: flex; align-items: stretch;
    border: 1.5px solid rgba(34,197,94,.28); border-radius: 8px;
    background: var(--search-bg); overflow: hidden;
    box-shadow: 0 0 0 1px rgba(34,197,94,.07), 0 2px 10px rgba(0,0,0,.45);
    transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(34,197,94,.22), inset 0 1px 0 var(--soft-highlight);
  }

  .search-scope {
    position: relative; flex: 0 0 88px;
    border-right: 1px solid var(--field-divider);
    background: var(--search-scope-bg);
  }
  .search-scope select {
    width: 100%; height: 100%; appearance: none;
    background: transparent; color: #d0d0d0;
    border: none; outline: none;
    padding: 0 26px 0 11px;
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .search-scope select option { background: var(--search-bg); color: var(--text-primary); }
  .search-scope::after {
    content: '▾'; position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    color: var(--text-secondary); font-size: 11px; pointer-events: none;
  }
  .search-scope:hover { background: var(--field-hover); }

  .search-input {
    flex: 1; padding: 10px 14px; border: none; outline: none;
    font-size: 14px; background: transparent; color: var(--text-primary);
    min-width: 0;
  }
  .search-input::placeholder { color: var(--placeholder); }
  .search-btn {
    padding: 0 18px; background: var(--accent); color: var(--accent-foreground); border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .search-btn:hover { background: var(--accent-hover); }

  /* 컨텐츠 */
  .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  /* 카드 그리드 */
  .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px)  { .card-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px)  { .card-grid { grid-template-columns: 1fr; } }

  /* 카드 */
  .card {
    background: var(--surface); border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); cursor: pointer; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 24px var(--card-hover-shadow); border-color: var(--border-strong); }
  .card-thumb {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: var(--thumb-bg); display: flex; align-items: center; justify-content: center; color: var(--thumb-text); font-size: 12px;
  }
  .card-duration {
    position: absolute; bottom: 7px; right: 7px;
    background: var(--duration-bg); color: var(--duration-text);
    font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
  }
  .card-body { padding: 10px 12px 12px; }
  .card-streamer { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--avatar-bg); flex-shrink: 0; }
  .streamer-name { font-size: 12px; color: var(--text-secondary); }
  .card-title {
    font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { font-size: 11px; color: var(--text-muted); }

  /* 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: var(--overlay);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 12px; width: 100%; max-width: 820px;
    overflow: hidden; border: 1px solid var(--border); box-shadow: 0 20px 60px var(--shadow);
  }
  .modal-video {
    width: 100%; aspect-ratio: 16/9; background: var(--video-bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--text-muted); font-size: 13px; position: relative;
  }
  .play-icon {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--play-bg); border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--accent);
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
    border-radius: 50%; background: var(--floating-control-bg); color: var(--floating-control-text); border: none;
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .modal-info { padding: 16px 20px 20px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
  .modal-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .dot { color: var(--text-muted); }
  .modal-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--avatar-bg); }
  .modal-actions { display: flex; gap: 10px; }
  .btn-primary {
    padding: 9px 18px; background: var(--accent); color: var(--accent-foreground); border: none;
    border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-ghost {
    padding: 9px 18px; background: var(--surface-muted); color: var(--text-secondary);
    border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; cursor: pointer;
  }

  /* 페이지 스위처 (와이어프레임 전용 — 실제 서비스에는 없음) */
  .page-switcher {
    background: var(--switcher-bg); border-bottom: 1px solid var(--border);
    padding: 8px 24px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
  }
  .page-switcher-label {
    font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    margin-right: 8px; font-weight: 600;
  }
  .page-switcher button {
    padding: 5px 12px; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 4px; font-size: 12px; cursor: pointer;
  }
  .page-switcher button.active,
  .theme-switch button.active { background: var(--accent); color: var(--accent-foreground); border-color: var(--accent); font-weight: 700; }
  .theme-switch { margin-left: auto; display: flex; gap: 4px; }

  /* 페이지 표시 제어 */
  .page { display: none; }
  .page.active { display: block; }

  /* 검색 결과 헤딩 */
  .result-heading { font-size: 14px; color: var(--text-secondary); margin-bottom: 14px; }
  .result-heading strong { color: var(--text-primary); }

  .dropdown {
    position: relative; min-width: 140px;
  }
  .dropdown select {
    width: 100%; height: 42px; appearance: none; background: var(--field); color: var(--text-primary);
    border: 1px solid var(--field-border); border-radius: 6px;
    padding: 8px 32px 8px 12px; font-size: 13px; cursor: pointer; outline: none;
    box-shadow: inset 0 1px 0 var(--soft-highlight);
  }
  .dropdown select:hover { border-color: var(--border-strong); background: var(--field-hover); }
  .dropdown select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring-soft); }
  .dropdown::after {
    content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-secondary); font-size: 11px; pointer-events: none;
  }
  .header-filters .dropdown { min-width: 82px; flex: 0 0 82px; height: 42px; }

  .autocomplete {
    position: relative; width: 150px; flex: 0 0 150px; height: 42px;
  }
  .autocomplete-field {
    position: relative; display: flex; align-items: center; height: 100%;
  }
  .autocomplete-input {
    width: 100%; height: 42px; background: var(--field); color: var(--text-primary);
    border: 1px solid var(--field-border); border-radius: 6px;
    padding: 8px 34px 8px 10px; font-size: 13px; outline: none;
    box-shadow: inset 0 1px 0 var(--soft-highlight);
    text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
  }
  .autocomplete-input::placeholder { color: var(--placeholder); }
  .autocomplete-input:hover { border-color: var(--border-strong); background: var(--field-hover); }
  .autocomplete-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--focus-ring-soft); }
  .autocomplete-toggle,
  .autocomplete-clear {
    position: absolute; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: var(--text-secondary);
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .autocomplete-toggle { right: 10px; pointer-events: none; }
  .autocomplete-clear { right: 23px; display: none; }
  .autocomplete.has-value .autocomplete-clear { display: block; }
  .autocomplete-panel {
    display: none; position: absolute; top: calc(100% + 6px); left: 0;
    min-width: 200px; width: max-content; max-width: 300px;
    background: var(--surface-elevated); border: 1px solid var(--field-border); border-radius: 7px;
    padding: 4px; z-index: 150; box-shadow: 0 12px 32px var(--shadow);
  }
  .autocomplete.open .autocomplete-panel { display: block; }
  .autocomplete-option {
    width: 100%; padding: 8px 10px; border: none; border-radius: 5px;
    background: transparent; color: var(--text-secondary); font-size: 13px; text-align: left;
    cursor: pointer;
  }
  .autocomplete-option:hover,
  .autocomplete-option.selected { background: var(--accent-soft); color: var(--accent); }
  .autocomplete-empty { padding: 8px 10px; color: var(--text-muted); font-size: 13px; }

  /* 카드 뱃지 (VOD / 클립 구분) */
  .card-badge {
    position: absolute; top: 7px; left: 7px;
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
    letter-spacing: 0.03em;
  }
  .card-badge.vod  { background: var(--vod-badge-bg); color: var(--vod-badge-text); }
  .card-badge.clip { background: var(--clip-badge-bg); color: var(--clip-badge-text); }

  /* 결과 끝 안내 */
  .end-of-list { text-align: center; padding: 32px 0 8px; color: var(--text-muted); font-size: 13px; }
  .placeholder-note { color: var(--text-muted); }

  /* 섹션 헤딩 (제목 + 우측 액션) */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-head .section-title { margin-bottom: 0; }
  .section-head .more-link {
    font-size: 13px; color: var(--text-muted); text-decoration: none; cursor: pointer;
  }
  .section-head .more-link:hover { color: var(--accent); }

  /* 히어로 캐러셀 — 한 번에 한 주제만 풀폭으로 노출 */
  .hero-carousel {
    position: relative; width: 100%; aspect-ratio: 24/9;
    border-radius: 12px; overflow: hidden; margin-bottom: 36px;
    border: 1px solid var(--border); background: var(--thumb-bg);
  }
  @media (max-width: 760px) { .hero-carousel { aspect-ratio: 16/9; } }

  .hero-slide {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity .5s ease;
    display: flex; align-items: flex-end;
    pointer-events: none;
  }
  .hero-slide.active { opacity: 1; pointer-events: auto; }

  .hero-cover {
    position: absolute; inset: 0;
    background: var(--hero-bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--hero-cover-text); font-size: 13px; letter-spacing: 0.05em;
  }
  .hero-cover::after {
    content: ''; position: absolute; inset: 0;
    background: var(--hero-overlay);
  }

  .hero-info {
    position: relative; z-index: 2;
    padding: 28px 40px 36px; max-width: 720px;
  }
  .hero-label {
    font-size: 12px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .hero-title {
    font-size: 28px; font-weight: 800; color: var(--hero-text);
    line-height: 1.25; margin-bottom: 10px;
    text-shadow: 0 2px 12px var(--hero-title-shadow);
  }
  @media (max-width: 760px) { .hero-title { font-size: 20px; } .hero-info { padding: 20px 20px 28px; } }
  .hero-meta {
    font-size: 13px; color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 6px;

  .hero-nav.next { right: 16px; }

  /* 페이지 닷 */

    position: absolute; bottom: 14px; right: 24px; z-index: 3;
    display: flex; gap: 6px;
  }
  .hero-dot {
    width: 8px; height: 8px; border-radius: 50%;

    transition: background .2s, width .2s;

  .hero-dot.active { background: var(--accent); width: 22px; border-radius: 4px; }

  /* 주제 카드 (관리자 큐레이션 컬렉션) */
  .topic-card {
    background: var(--surface); border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border); cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    display: flex; flex-direction: column;
  }
  .topic-card:hover {
    transform: translateY(-2px); border-color: var(--accent);
    box-shadow: 0 4px 24px var(--topic-hover-shadow);
  }
  .topic-cover {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: var(--hero-bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--hero-cover-text); font-size: 12px; overflow: hidden;
  }
  .topic-cover-overlay {
    position: absolute; inset: 0;
    background: var(--topic-overlay);
    display: flex; align-items: flex-end; padding: 12px;
  }
  .topic-count-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--duration-bg); color: var(--duration-text);
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .topic-body { padding: 12px 14px 14px; }
  .topic-title {
    font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .topic-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }

  /* 헤더 우측 로그인/프로필 */
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex: 0 0 auto; margin-left: auto; }
  .theme-toggle-btn {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--surface-muted); border: 1px solid var(--border);
    font-size: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: border-color .15s, color .15s;
  }
  .theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle-btn svg { display: block; }
  .login-btn {
    padding: 8px 14px; background: transparent; color: var(--text-secondary);
    border: 1.5px solid var(--border); border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .login-btn:hover { border-color: var(--accent); color: var(--accent); }
  .profile {
    display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
    border-radius: 20px; cursor: pointer; background: var(--surface-muted);
  }
  .profile .avatar { width: 28px; height: 28px; }
  .profile-name { font-size: 13px; color: var(--text-primary); font-weight: 600; }

  @media (max-width: 760px) {
    header { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    .logo { order: 1; font-size: 18px; }
    .header-right { order: 2; flex: 0 0 auto; margin-left: auto; }
    .search-area { order: 3; flex: 1 1 100%; flex-wrap: wrap; justify-content: stretch; }
    .search-wrap { order: 3; flex: 1 1 100%; max-width: none; min-width: 0; width: 100%; }

      order: 4; flex: 0 0 100%; overflow-x: auto; padding-bottom: 2px;
      flex-wrap: nowrap; scrollbar-width: thin;
    }
    .header-filters .dropdown,
    .autocomplete { flex-shrink: 0; }
    .search-scope { flex-basis: 82px; }
    .search-scope select { padding-left: 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- 페이지 스위처 (와이어프레임 데모용 — 실제 서비스에는 없음) -->

<script>
  const root = document.documentElement;

  const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="2" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="22" y2="12"/>
    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
    <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
    <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
  </svg>`;
  const MOON_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>`;

  function getPreferredTheme() {
    try {
      const saved = localStorage.getItem('cheeseboard-wf-theme');
      if (saved === 'light' || saved === 'dark') return saved;
    } catch (_) {}
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }

  function setTheme(theme) {
    root.dataset.theme = theme;
    try {
      localStorage.setItem('cheeseboard-wf-theme', theme);
    } catch (_) {}
    document.querySelectorAll('.theme-switch button').forEach(button => {
      button.classList.toggle('active', button.dataset.themeValue === theme);
    });
    const toggleBtn = document.getElementById('theme-toggle-btn');
    if (toggleBtn) toggleBtn.innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
  }

  function toggleTheme() {
    setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  }

  setTheme(getPreferredTheme());

  const streamerOptions = ['울프', '침착맨', '풍월량', '강지', '탬탬버린', '인섹', 'LCK'];
  const categoryOptions = ['리그 오브 레전드', '발로란트', '오버워치 2', '종합 게임', '보더랜즈', '그냥 채팅'];

  function createAutocomplete(root, options, placeholder) {
    let selected = '';
    root.innerHTML = `
      <div class="autocomplete-field">
        <input class="autocomplete-input" type="text" placeholder="${placeholder}" autocomplete="off">
        <button class="autocomplete-clear" type="button" aria-label="${placeholder} 초기화">×</button>
        <span class="autocomplete-toggle">▾</span>
      </div>
      <div class="autocomplete-panel"></div>`;

    const input = root.querySelector('.autocomplete-input');
    const clearBtn = root.querySelector('.autocomplete-clear');
    const panel = root.querySelector('.autocomplete-panel');

    function normalize(value) {
      return value.trim().toLowerCase();
    }

    function render() {
      const query = normalize(input.value);
      const matches = query
        ? options.filter(option => normalize(option).includes(query))
        : options;

      if (matches.length === 0) {
        panel.innerHTML = '<div class="autocomplete-empty">결과 없음</div>';
        root.classList.add('open');
        return;
      }

      panel.innerHTML = matches.map(option => `
        <button class="autocomplete-option${option === selected ? ' selected' : ''}" type="button" data-value="${option}">
          ${option}
        </button>
      `).join('');
      root.classList.add('open');
    }

    input.addEventListener('input', () => {
      selected = '';
      root.classList.remove('has-value');
      render();
    });

    input.addEventListener('focus', render);

    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') root.classList.remove('open');
    });

    panel.addEventListener('mousedown', event => {
      const option = event.target.closest('.autocomplete-option');
      if (!option) return;
      selected = option.dataset.value;
      input.value = selected;
      root.classList.add('has-value');
      root.classList.remove('open');
      event.preventDefault();
    });

    clearBtn.addEventListener('click', () => {
      selected = '';
      input.value = '';
      root.classList.remove('has-value');
      input.focus();
      render();
    });

    document.addEventListener('click', event => {
      if (!root.contains(event.target)) root.classList.remove('open');
    });
  }

  createAutocomplete(document.getElementById('streamer-filter'), streamerOptions, '스트리머');
  createAutocomplete(document.getElementById('category-filter'), categoryOptions, '카테고리');

  const data = [
    { title:'울챔스 레전드 장면 모음.zip', streamer:'울프', views:'21.1만', date:'3일 전', dur:'8:24' },
    { title:'침착맨 반응 레전드 박제', streamer:'침착맨', views:'15.3만', date:'5일 전', dur:'3:41' },
    { title:'이 장면은 진짜 너무 웃겼음 ㅋㅋ', streamer:'풍월량', views:'9.8만', date:'1일 전', dur:'1:12' },
    { title:'진짜 말도 안 되는 캐리 클립', streamer:'인섹', views:'7.2만', date:'2일 전', dur:'2:05' },
    { title:'합방 중 터진 레전드 순간', streamer:'강지', views:'12.4만', date:'4일 전', dur:'5:33' },
    { title:'BRO vs KT 명장면', streamer:'LCK', views:'44.2만', date:'10일 전', dur:'4:17' },
    { title:'이거 보고 웃겨서 ㅋㅋ 진짜', streamer:'탬탬버린', views:'5.1만', date:'6일 전', dur:'0:58' },
    { title:'역대급 한타 클립 모음', streamer:'울프', views:'18.9만', date:'2일 전', dur:'6:45' },
  ];

  // 검색 결과: VOD/클립 혼합 데이터
  const searchData = [
    { type:'vod',  title:'롤챔스 결승 풀버전 다시보기', streamer:'LCK', views:'89.4만', date:'2026-04-22', dur:'3:42:18' },
    { type:'clip', title:'롤챔스 결승 마지막 한타 ㄷㄷㄷ', streamer:'울프', views:'42.1만', date:'3주 전', dur:'1:24' },
    { type:'clip', title:'롤챔스 우승 세레머니 박제', streamer:'페이커팬', views:'31.7만', date:'3주 전', dur:'2:08' },
    { type:'vod',  title:'롤챔스 4강 BRO vs KT 분석 방송', streamer:'분석왕', views:'6.2만', date:'2026-04-15', dur:'2:18:50' },
    { type:'clip', title:'롤챔스 명장면 컴필레이션', streamer:'편집장', views:'18.9만', date:'1달 전', dur:'5:12' },
    { type:'clip', title:'롤챔스 결승 펜타킬 그 장면', streamer:'울프', views:'24.5만', date:'3주 전', dur:'0:48' },
    { type:'vod',  title:'롤챔스 시즌 회고 — 5시간 토크', streamer:'침착맨', views:'12.1만', date:'2026-04-30', dur:'5:11:02' },
    { type:'clip', title:'롤챔스 인터뷰 레전드 답변', streamer:'기자', views:'9.4만', date:'4주 전', dur:'1:56' },
  ];

  // 관리자 추천 주제 (Topic) — 한 카드 = 한 컬렉션
  const topicData = [
    { title:'2026 롤챔스 결승 명장면',     count:14, summary:'클립 11 · VOD 3' },
    { title:'침착맨 레전드 합방 모음',     count:22, summary:'클립 18 · VOD 4' },
    { title:'이번 주 풍월량 베스트',       count:8,  summary:'클립 8' },
    { title:'강지 우정합방 BEST',          count:12, summary:'클립 9 · VOD 3' },
    { title:'에디터 PICK — 신년 합방 정리', count:17, summary:'클립 13 · VOD 4' },
    { title:'LCK 시즌 분석 모음',          count:10, summary:'VOD 10' },
  ];

  function renderCard(d) {
    const typeBadge = d.type ? `<span class="card-badge ${d.type}">${d.type === 'vod' ? 'VOD' : '클립'}</span>` : '';
    return `
      <div class="card" onclick="document.getElementById('modal').classList.add('open')">
        <div class="card-thumb">
          ${typeBadge}
          <span>썸네일</span>
          <span class="card-duration">${d.dur}</span>
        </div>
        <div class="card-body">
          <div class="card-streamer"><div class="avatar"></div><span class="streamer-name">${d.streamer}</span></div>
          <div class="card-title">${d.title}</div>
          <div class="card-meta">${d.views} 회 · ${d.date}</div>
        </div>
      </div>`;
  }

  function renderTopicCard(t) {
    return `
      <div class="topic-card" onclick="switchPage('topic-detail')">
        <div class="topic-cover">
          <span>커버 이미지</span>
          <span class="topic-count-badge">영상 ${t.count}개</span>
          <div class="topic-cover-overlay"></div>
        </div>
        <div class="topic-body">
          <div class="topic-title">${t.title}</div>
          <div class="topic-meta">${t.summary}</div>
        </div>
      </div>`;
  }

  // TODO: 무한스크롤 — 메인 페이지
  // IntersectionObserver로 grid 하단 sentinel 감지 → mock 데이터 순환 추가 렌더
  // 총 N개(예: 40개) 초과 시 "모든 결과를 불러왔습니다" 표시 후 observer 해제
  document.getElementById('grid').innerHTML = data.map(renderCard).join('');

  // TODO: 무한스크롤 — 검색 결과 페이지
  // 동일 패턴. searchData 순환 렌더 → 상단 "약 N건" 카운트는 고정값 유지
  document.getElementById('grid-search').innerHTML = searchData.map(renderCard).join('');

  // ─── 히어로 캐러셀 (한 번에 한 주제만) ───
  // 추천 주제가 하나도 없으면 섹션 전체를 숨김
  if (topicData.length === 0) {
    document.getElementById('hero-section').style.display = 'none';
  }

  let heroIdx = 0;
  let heroTimer = null;

  const heroCarousel = document.getElementById('hero-carousel');
  const heroDots = document.getElementById('hero-dots');

  // 슬라이드 렌더링 (네비/닷 앞에 삽입)
  topicData.forEach((t, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.innerHTML = `
      <div class="hero-cover"><span>커버 이미지</span></div>
      <div class="hero-info">
        <div class="hero-label">🌟 추천 주제</div>
        <div class="hero-title">${t.title}</div>
        <div class="hero-meta">영상 ${t.count}개 · ${t.summary}</div>
        <button class="hero-cta" onclick="switchPage('topic-detail')">주제 보러가기 →</button>
      </div>`;
    heroCarousel.insertBefore(slide, heroCarousel.querySelector('.hero-nav.prev'));

    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => heroGo(i);
    heroDots.appendChild(dot);
  });

  function heroGo(i) {
    heroIdx = (i + topicData.length) % topicData.length;
    heroCarousel.querySelectorAll('.hero-slide').forEach((s, idx) => s.classList.toggle('active', idx === heroIdx));
    heroDots.querySelectorAll('.hero-dot').forEach((d, idx) => d.classList.toggle('active', idx === heroIdx));
    resetHeroTimer();
  }
  function heroNext() { heroGo(heroIdx + 1); }
  function heroPrev() { heroGo(heroIdx - 1); }
  function resetHeroTimer() {
    clearInterval(heroTimer);
    heroTimer = setInterval(heroNext, 6000);
  }
  resetHeroTimer();

  function close() { document.getElementById('modal').classList.remove('open'); }

  // 페이지 스위처
  function switchPage(name) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.page-switcher button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
